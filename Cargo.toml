[workspace]
resolver = "2"
members = [
    "crates/rill-attach",
    "crates/rill-kernel",
    "crates/rill-chip0",
    "crates/rilld",
    "crates/rill-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
rill-attach = { path = "crates/rill-attach" }
rill-kernel = { path = "crates/rill-kernel" }
rill-chip0 = { path = "crates/rill-chip0" }
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
