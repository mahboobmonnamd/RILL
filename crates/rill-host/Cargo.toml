[package]
name = "rill-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI attach client + Chip 1. Does not spawn the user shell."

[lib]
name = "rill_host"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "rill-host"
path = "src/bin/rill_host.rs"

[dependencies]
rill-attach.workspace = true
rill-content.workspace = true
rill-look.workspace = true
rill-vt-types.workspace = true
vt-engine.workspace = true
libc.workspace = true

[features]
mutate = ["vt-engine/mutate", "rill-look/mutate"]
