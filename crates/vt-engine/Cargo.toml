[package]
name = "vt-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chip 1 VT engine: bytes in, POD snapshots out (ADR 0054 live chip)."

[features]
# Negative-control mutations (ADR 0002 D3). No shipping build enables this.
mutate = []

[dependencies]
rill-vt-types.workspace = true

[dev-dependencies]
vte = { version = "0.15", default-features = false }
unicode-width = { version = "0.2", default-features = false }
