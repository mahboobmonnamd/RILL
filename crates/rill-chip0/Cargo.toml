[package]
name = "rill-chip0"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chip 0: libghostty-vt adapter + POD cells (lane C)"

[features]
# Negative-control mutations (ADR 0002 D3). Enabled only by
# `validate-spike0.sh --negative-controls`. No shipping build sets it, so
# production carries no mutation code.
mutate = ["rill-look/mutate"]

[dependencies]
rill-vt-types.workspace = true
rill-look.workspace = true
libc.workspace = true
serde.workspace = true
toml.workspace = true

[build-dependencies]
cc = "1"
