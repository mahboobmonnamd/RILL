[package]
name = "rilld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session kernel daemon — owns the PTY, survives GUI death"

[lib]
name = "rilld"
path = "src/lib.rs"

[[bin]]
name = "rilld"
path = "src/main.rs"

[features]
mutate = ["rill-kernel/mutate", "vt-engine/mutate"]

[dependencies]
rill-attach.workspace = true
rill-kernel.workspace = true
rill-vt-types.workspace = true
vt-engine.workspace = true
libc.workspace = true

[dev-dependencies]
rill-vt-types.workspace = true
vt-engine.workspace = true
