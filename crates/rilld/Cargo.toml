[package]
name = "rilld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session kernel daemon — owns the PTY, survives GUI death"

[lib]
name = "rilld"
path = "src/lib.rs"

[[bin]]
name = "rilld"
path = "src/main.rs"

[features]
# Negative-control mutations (ADR 0002 D3). Propagates to the crates whose
# behaviour the mutations change. No shipping build enables this.
mutate = ["rill-kernel/mutate", "rill-chip0/mutate"]

[dependencies]
rill-attach.workspace = true
rill-kernel.workspace = true
rill-chip0.workspace = true
libc.workspace = true
