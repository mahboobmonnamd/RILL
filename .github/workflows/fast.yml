# Fast tier. Linux, no Zig. Live chip is vt-engine (ADR 0054).
name: fast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-planes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plane invariants (AGENTS.md §5, ADR 0002 D9)
        run: sh scripts/lint-planes.sh

  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (fast tier)
        run: cargo clippy -p rill-attach -p rill-kernel -p rill-vt-types -p vt-engine -p rill-look --all-targets -- -D warnings

      - name: Attach codec tests
        run: cargo test -p rill-attach -- --nocapture

      - name: Kernel tests that do not need a display chip
        run: cargo test -p rill-kernel -- --test-threads=1 --nocapture

      - name: rilld Chip 1 resync
        run: cargo test -p rilld --test t_vt_live_resync -- --test-threads=1 --nocapture

      - name: Chip 1 types and engine
        run: cargo test -p rill-vt-types -p vt-engine -p rill-look -- --nocapture

      - name: T-CHIP1 slice 2 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice2 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-ASCII drop_print t_chip1_ascii_printable_lands_in_the_pod_grid
          red T-CHIP1-BYTES drop_high_bytes t_chip1_bytes_invalid_utf8_reaches_the_parser
          red T-CHIP1-C1 c1_as_control t_chip1_c1_decoded_scalar_paints_and_does_not_open_csi
          red T-CHIP1-CRLF ignore_crlf t_chip1_crlf_moves_the_cursor
          red T-CHIP1-WRAP eager_wrap t_chip1_wrap_last_column_defers
          red T-CHIP1-SIZE unbounded_history t_chip1_size_snapshot_is_cols_times_rows
          red T-CHIP1-DAMAGE always_full_damage t_chip1_damage_untouched_frame_can_be_skipped

      - name: T-CHIP1 slice 3 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice3 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-CUP ignore_csi t_chip1_cup_positions_the_cursor
          red T-CHIP1-ED noop_ed t_chip1_ed_erase_display_clears_to_space

      - name: T-CHIP1 slice 4 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice4 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-SCROLL ignore_decstbm t_chip1_scroll_decstbm_confines_the_scroll
          red T-CHIP1-ALT single_buffer t_chip1_alt_1049_preserves_primary

      - name: T-CHIP1 slice 5 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice5 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-SGR ignore_sgr t_chip1_sgr_bold_sets_attrs_bit_0
          red T-CHIP1-COLOR-IDENTITY sgr_rgb_at_parse t_chip1_color_identity_sgr_keeps_palette_index
          red T-CHIP1-LOOK-ANSI skip_file_palette t_chip1_look_ansi_sgr_colours_come_from_the_theme_file

      - name: T-CHIP1 slice 6 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice6 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-REPLY no_reply t_chip1_reply_da_and_dsr_are_answered
          red T-CHIP1-REPLY unbounded_replies t_chip1_reply_overflow_drops_and_counts

      - name: T-CHIP1 slice 7 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice7 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-GRAPHEME fixed_grapheme_buf t_chip1_grapheme_long_cluster_does_not_overrun
          red T-CHIP1-WIDTH narrow_cjk t_chip1_width_nihon_x_advances_five_columns
          red T-CHIP1-WIDTH-SMASH orphan_wide_tail t_chip1_width_ech_of_wide_lead_clears_both_halves

      - name: T-CHIP1 slice 8 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-BOUNDS unbounded_osc --test t_chip1_slice8 t_chip1_bounds_hostile_sequences_stay_bounded
          red T-CHIP1-DIFF drop_high_bytes t_chip1_diff_in_tree_agrees_with_vte_over_the_corpus
          red T-CHIP1-DIFF c1_as_control t_chip1_diff_in_tree_agrees_with_vte_over_the_corpus

      - name: T-CHIP1 slice 9 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice9 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-RESYNC empty_resync t_chip1_resync_emit_bytes_reconstruct_the_grid
          red T-CHIP1-RESYNC emit_wide_tails t_chip1_resync_wide_cjk_does_not_double

      - name: T-CHIP1 slice 10 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice10 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-MODE ignore_mode_updates t_chip1_mode_tracks_host_encoder_flags

      - name: T-CHIP1 slice 11 negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p vt-engine --features mutate --test t_chip1_slice11 "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CHIP1-CHECKPOINT-ROUNDTRIP empty_checkpoint t_chip1_checkpoint_roundtrip_restores_grid_and_modes
          red T-CHIP1-CHECKPOINT-HASH constant_hash t_chip1_checkpoint_hash_changes_when_cell_flips
          red T-CHIP1-CHECKPOINT-VERSION accept_unknown_version t_chip1_checkpoint_unknown_version_fails_closed
          red T-CHIP1-CHECKPOINT-NOT-RESYNC import_is_resync_bytes t_chip1_checkpoint_import_is_not_vt_replay

      # M1 T-GRAPH (ADR 0014 D1). Mutations must go red (ADR 0002 D3).
      # rilld named-id / flood stay in validate-spike0.sh (Chip 0 toolchain).
      - name: T-GRAPH kernel negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-kernel --features mutate "$@" -- --test-threads=1 --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-GRAPH-SPAWN single_session t_graph_two_sessions_have_distinct_child_pids
          red T-GRAPH-ISOLATE single_session t_graph_histories_do_not_mix
          red T-GRAPH-ATTACH single_session t_graph_attach_to_a_second_id_is_accepted
          red T-GRAPH-TERMINATE terminate_all_leaves t_graph_terminate_one_leaf_leaves_the_other_alive
          red T-GRAPH-DELIVERY always_pending t_graph_input_write_is_dispatched
          red T-GRAPH-EVENTS duplicate_event_ids t_graph_event_ids_are_unique_and_terminate_is_idempotent
          red T-GRAPH-LAYOUT omit_second_leaf t_graph_layout_snapshot_names_every_live_leaf
          red T-GRAPH-EPHEMERAL ignore_ephemeral t_graph_ephemeral_drop_terminates_the_child
          red T-GRAPH-LIFECYCLE-MODE-FIXED dynamic_ephemeral_env t_graph_lifecycle_mode_is_fixed_at_spawn

      - name: T-RUNTIME checkpoint negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-kernel --features mutate --test t_runtime_checkpoint "$@" -- --test-threads=1 --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-RUNTIME-DAEMON-STATE blank_core t_runtime_daemon_state_recovery_matches_independent_vt
          red T-RUNTIME-UPDATE-COMPAT accept_incompatible_checkpoint t_runtime_update_compat_refuses_unknown_format

      - name: T-RUNTIME journal negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-kernel --features mutate --test t_runtime_journal "$@" -- --test-threads=1 --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-RUNTIME-HOST-SHUTDOWN-JOURNAL missing_worker_reported_running t_runtime_host_shutdown_journal_is_honest

      - name: T-CLIENT lease negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-kernel --features mutate --test t_client_lease "$@" -- --test-threads=1 --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CLIENT-LEASE-ATOMIC both_leases_valid t_client_lease_atomic_one_generation_one_nonce
          red T-CLIENT-LEASE-EXPIRY-DETACH expiry_terminates t_client_lease_expiry_detaches_input_not_the_process

      - name: T-CLIENT viewport negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-kernel --features mutate --test t_client_viewport "$@" -- --test-threads=1 --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CLIENT-VIEWPORT-AUTHORITY largest_observer_wins t_client_viewport_authority_observer_does_not_set_child_winsize

      - name: T-CLIENT mirror negative controls
        run: |
          set -eu
          red() {
            name="$1"
            mut="$2"
            shift 2
            if RILL_MUTATE="$mut" cargo test -p rill-attach --features mutate --test t_client_mirror "$@" -- --nocapture; then
              echo "BROKEN INSTRUMENT: $name stayed green under $mut" >&2
              exit 1
            fi
            echo "ok: $name went red under $mut"
          }
          red T-CLIENT-MIRROR-DISPOSABLE skip_host_checkpoint t_client_mirror_disposable_rebuilds_from_host
          red T-CLIENT-MIRROR-RECONCILE mismatch_keeps_presenting t_client_mirror_reconcile_requests_checkpoint
          red T-CLIENT-RING-EVICTION-RESYNC replay_from_ring_base t_client_ring_eviction_resync_uses_checkpoint

  fuzz-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # SPEC-ATTACH §9. Bounded here; longer runs nightly.
      - name: Fuzz the frame decoder
        working-directory: crates/rill-attach
        run: cargo fuzz run decoder -- -max_total_time=60 -runs=200000

  fuzz-vt-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz Chip 1 feed
        working-directory: crates/vt-engine
        run: cargo fuzz run feed -- -max_total_time=30 -runs=50000

