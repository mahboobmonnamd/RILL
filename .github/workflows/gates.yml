# Packaged macOS gates. No Zig. Live chip is vt-engine (ADR 0054).
#
# ADR 0002 D8: a gate that has never run in CI is not evidence, whatever a
# laptop printed. Until a self-hosted macOS runner exists this is
# workflow_dispatch, and the uploaded evidence artifact — not a pasted terminal
# transcript — is what a PR cites.
name: gates

on:
  workflow_dispatch:
    inputs:
      negative_controls:
        description: "Also run negative controls (ADR 0002 D3)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "crates/**"
      - "host/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  gates:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package Rill.app
        run: sh scripts/package-macos.sh

      - name: Gate suite including negative controls
        env:
          RILL_NFR_MODE: app
          RILL_NFR_OPTIONAL: "1"
          RILL_NFR_TIMEOUT_SEC: "45"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.negative_controls }}" = "false" ]; then
            sh scripts/validate-spike0.sh
          else
            sh scripts/validate-spike0.sh --negative-controls
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike0-evidence
          path: evidence/
          if-no-files-found: error

      - name: Restate what this run cannot close
        if: always()
        run: |
          echo "This runner has no physical display, no battery, no Spaces, and is 1×."
          echo "T-NFR here is 'app' mode only and does NOT close the gate."
          echo "T-FS-EXIT and T-GLYPH-SCALE are recorded but do not fail this job."
          echo "Closure requires a real Mac: hid on battery, Retina, Spaces (ADR 0003 D7, D8; ADR 0009 D4)."
